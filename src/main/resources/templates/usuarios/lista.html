<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="main-content" class="flex-grow-1">
        <div class="top-navbar"><h1 class="page-title"><i class="bi bi-person-gear me-2"></i>Usuarios</h1>
            <span th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span></div>
        <div class="page-content">
            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div class="tabla-container">
                <div class="d-flex justify-content-between align-items-center p-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-people me-2" style="color:#B58863"></i>Lista de Usuarios</h5>
                    <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#modalNuevo"><i class="bi bi-plus-lg"></i> Nuevo Usuario</button>
                </div>
                <div class="table-responsive"><table class="table mb-0 align-middle"><thead><tr>
                    <th>#</th><th>NOMBRE</th><th>APELLIDO</th><th>EMAIL</th><th>ROL</th><th>ACCIONES</th>
                </tr></thead><tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}"></td><td th:text="${u.nombre}"></td><td th:text="${u.apellido}"></td><td th:text="${u.email}"></td>
                    <td><span class="badge" style="background:#B58863" th:text="${u.rol}"></span></td>
                    <td>
                        <button class="btn btn-sm btn-secondary" th:onclick="'editarUsuario(' + ${u.id} + ')'" title="Editar"><i class="bi bi-pencil-fill"></i></button>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" onclick="return confirm('¿Eliminar usuario?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr></tbody></table></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevo" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form th:action="@{/usuarios/guardar}" method="post">
        <div class="modal-header"><h5 class="modal-title">Nuevo usuario</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input name="nombre" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Apellido</label><input name="apellido" class="form-control" required></div></div>
            <div class="mt-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
            <div class="mt-3"><label class="form-label">Contraseña</label><input name="password" type="password" class="form-control" required></div>
            <div class="mt-3"><label class="form-label">Rol</label><select name="rol" class="form-select" required><option>ADMIN</option><option>DOCENTE</option><option>ESTUDIANTE</option></select></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancelar</button><button class="btn btn-primary" type="submit">Guardar</button></div>
    </form>
</div></div></div>

<div class="modal fade" id="modalEditar" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <form th:action="@{/usuarios/actualizar}" method="post">
        <div class="modal-header"><h5 class="modal-title">Editar usuario</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="hidden" name="id" id="editId">
            <div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input name="nombre" id="editNombre" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Apellido</label><input name="apellido" id="editApellido" class="form-control" required></div></div>
            <div class="mt-3"><label class="form-label">Email</label><input name="email" id="editEmail" type="email" class="form-control" required></div>
            <div class="mt-3"><label class="form-label">Nueva contraseña (opcional)</label><input name="password" type="password" class="form-control"></div>
            <div class="mt-3"><label class="form-label">Rol</label><select name="rol" id="editRol" class="form-select" required><option>ADMIN</option><option>DOCENTE</option><option>ESTUDIANTE</option></select></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancelar</button><button class="btn btn-primary" type="submit">Actualizar</button></div>
    </form>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function editarUsuario(id){
 fetch('/usuarios/editar/'+id).then(r=>r.json()).then(u=>{
   document.getElementById('editId').value=u.id;
   document.getElementById('editNombre').value=u.nombre;
   document.getElementById('editApellido').value=u.apellido;
   document.getElementById('editEmail').value=u.email;
   document.getElementById('editRol').value=u.rol;
   new bootstrap.Modal(document.getElementById('modalEditar')).show();
 });
}
</script>
</body></html>
