<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div id="sidebar-overlay"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="main-content" class="flex-grow-1">        <div class="top-navbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn-sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <h1 class="page-title"><i class="bi bi-person-gear me-2"></i>Usuarios</h1>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="user-name-sm" style="font-size:0.85rem;color:#3D4D55;" th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span>
                <div class="user-badge" th:text="${#strings.substring(session.usuario.nombre,0,1)}"></div>
            </div>
        </div>
        <div class="page-content">
            <div th:if="${mensaje}" class="alert alert-success d-flex align-items-center gap-2 mb-3 py-2"><i class="bi bi-check-circle-fill"></i><span th:text="${mensaje}"></span></div>
            <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 mb-3 py-2"><i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span></div>
            <div class="tabla-container">
                <div class="tabla-header">
                    <h5><i class="bi bi-people me-2" style="color:#B58863;"></i>Lista de Usuarios</h5>
                    <button class="btn btn-sm btn-accent" data-bs-toggle="modal" data-bs-target="#modalNuevo"><i class="bi bi-plus-lg me-1"></i> Nuevo Usuario</button>
                </div>
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead><tr><th>#</th><th>Nombre</th><th>Apellido</th><th class="col-hide-sm">Email</th><th>Rol</th><th>Acciones</th></tr></thead>
                        <tbody>
                        <tr th:each="u, stat : ${usuarios}">
                            <td th:text="${stat.count}"></td><td th:text="${u.nombre}"></td><td th:text="${u.apellido}"></td>
                            <td class="col-hide-sm" th:text="${u.email}"></td>
                            <td><span class="badge" style="background:#B58863" th:text="${u.rol}"></span></td>
                            <td>
                                <button class="btn btn-edit btn-sm me-1" th:onclick="'editarUsuario(' + ${u.id} + ')'" title="Editar"><i class="bi bi-pencil-fill"></i></button>
                                <a class="btn btn-delete btn-sm" th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" onclick="return confirm('¿Eliminar usuario?')"><i class="bi bi-trash-fill"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="6" class="text-center py-4" style="color:#A79E9C;"><i class="bi bi-inbox fs-3 d-block mb-2"></i>No hay usuarios.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevo" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-person-plus-fill me-2"></i>Nuevo Usuario</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <form th:action="@{/usuarios/guardar}" method="post" id="formNuevo" novalidate><div class="modal-body">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nombre *</label>
                <input name="nombre" class="form-control" pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ\s]+$" maxlength="100" required>
                <div class="invalid-feedback">Solo letras y espacios.</div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Apellido *</label>
                <input name="apellido" class="form-control" pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ\s]+$" maxlength="100" required>
                <div class="invalid-feedback">Solo letras y espacios.</div>
            </div>
        </div>
        <div class="mt-3">
            <label class="form-label">Email *</label>
            <input name="email" type="email" class="form-control" required>
            <div class="invalid-feedback">Ingresa un email válido.</div>
        </div>
        <div class="mt-3">
            <label class="form-label">Contraseña *</label>
            <input name="password" type="password" class="form-control" minlength="4" required>
            <div class="invalid-feedback">Mínimo 4 caracteres.</div>
        </div>
        <div class="mt-3">
            <label class="form-label">Rol *</label>
            <select name="rol" class="form-select" required><option value="">Seleccionar...</option><option>ADMIN</option><option>DOCENTE</option><option>ESTUDIANTE</option></select>
            <div class="invalid-feedback">Selecciona un rol.</div>
        </div>
    </div><div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal" type="button">Cancelar</button>
        <button class="btn btn-accent btn-sm" type="submit"><i class="bi bi-save me-1"></i>Guardar</button>
    </div></form>
</div></div></div>

<div class="modal fade" id="modalEditar" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-pencil-fill me-2"></i>Editar Usuario</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <form th:action="@{/usuarios/actualizar}" method="post" id="formEditar" novalidate><input type="hidden" name="id" id="editId">
        <div class="modal-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre *</label>
                    <input name="nombre" id="editNombre" class="form-control" pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ\s]+$" maxlength="100" required>
                    <div class="invalid-feedback">Solo letras y espacios.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Apellido *</label>
                    <input name="apellido" id="editApellido" class="form-control" pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ\s]+$" maxlength="100" required>
                    <div class="invalid-feedback">Solo letras y espacios.</div>
                </div>
            </div>
            <div class="mt-3">
                <label class="form-label">Email *</label>
                <input name="email" id="editEmail" type="email" class="form-control" required>
                <div class="invalid-feedback">Ingresa un email válido.</div>
            </div>
            <div class="mt-3">
                <label class="form-label">Nueva contraseña <small class="text-muted">(dejar vacío para no cambiar)</small></label>
                <input name="password" type="password" class="form-control">
            </div>
            <div class="mt-3">
                <label class="form-label">Rol *</label>
                <select name="rol" id="editRol" class="form-select" required><option>ADMIN</option><option>DOCENTE</option><option>ESTUDIANTE</option></select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal" type="button">Cancelar</button>
            <button class="btn btn-accent btn-sm" type="submit"><i class="bi bi-save me-1"></i>Actualizar</button>
        </div>
    </form>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    // Sidebar toggle
    const _sb=document.getElementById('sidebar'),_ov=document.getElementById('sidebar-overlay'),_btn=document.getElementById('sidebarToggle');
    if(_btn)_btn.addEventListener('click',()=>{_sb.classList.add('sidebar-open');_ov.classList.add('show');});
    if(_ov)_ov.addEventListener('click',()=>{_sb.classList.remove('sidebar-open');_ov.classList.remove('show');});
    // Validacion
    function activarVal(...ids){ids.forEach(fid=>{const f=document.getElementById(fid);if(!f)return;f.addEventListener('submit',e=>{if(!f.checkValidity()){e.preventDefault();e.stopPropagation();}f.classList.add('was-validated');});f.closest('.modal')?.addEventListener('hidden.bs.modal',()=>f.classList.remove('was-validated'));});}
    function soloNum(e){e.target.value=e.target.value.replace(/[^0-9]/g,'');}


    function editarUsuario(id){
        fetch('/usuarios/editar/'+id).then(r=>r.json()).then(u=>{
            document.getElementById('editId').value=u.id;
            document.getElementById('editNombre').value=u.nombre;
            document.getElementById('editApellido').value=u.apellido;
            document.getElementById('editEmail').value=u.email;
            document.getElementById('editRol').value=u.rol;
            document.getElementById('formEditar').classList.remove('was-validated');
            new bootstrap.Modal(document.getElementById('modalEditar')).show();
        });
    }
    activarVal('formNuevo','formEditar');

</script>
</body>
</html>
