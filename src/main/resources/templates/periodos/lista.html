<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodos - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="main-content" class="flex-grow-1">
        <div class="top-navbar">
            <h1 class="page-title"><i class="bi bi-calendar3 me-2"></i>Periodos Académicos</h1>
            <div class="d-flex align-items-center gap-2">
                <span style="font-size:0.85rem; color:#3D4D55;"
                      th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span>
                <div class="user-badge" th:text="${#strings.substring(session.usuario.nombre,0,1)}"></div>
            </div>
        </div>

        <div class="page-content">
            <div th:if="${mensaje}" class="alert alert-success d-flex align-items-center gap-2 mb-3 py-2">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${mensaje}"></span>
            </div>

            <div class="tabla-container">
                <div class="tabla-header">
                    <h5><i class="bi bi-calendar3 me-2" style="color:#B58863;"></i>Lista de Periodos</h5>
                    <button class="btn btn-sm btn-accent" data-bs-toggle="modal" data-bs-target="#modalNuevo">
                        <i class="bi bi-plus-lg me-1"></i> Nuevo Periodo
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Fecha Inicio</th>
                            <th>Fecha Fin</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p, stat : ${periodos}">
                            <td th:text="${stat.count}"></td>
                            <td th:text="${p.nombre}"></td>
                            <td th:text="${p.fechaInicio}"></td>
                            <td th:text="${p.fechaFin}"></td>
                            <td>
                                <button class="btn btn-edit btn-sm me-1"
                                        th:onclick="'cargarEditar(' + ${p.id} + ')'"
                                        data-bs-toggle="modal" data-bs-target="#modalEditar">
                                    <i class="bi bi-pencil-fill"></i>
                                </button>
                                <a th:href="@{/periodos/eliminar/{id}(id=${p.id})}"
                                   class="btn btn-delete btn-sm"
                                   onclick="return confirm('¿Eliminar este periodo?')">
                                    <i class="bi bi-trash-fill"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(periodos)}">
                            <td colspan="5" class="text-center py-4" style="color:#A79E9C;">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                No se encontraron periodos.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevo" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-calendar-plus me-2"></i>Nuevo Periodo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/periodos/guardar}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Ej: 2026-I" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Fecha Inicio</label>
                            <input type="date" name="fechaInicio" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha Fin</label>
                            <input type="date" name="fechaFin" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-accent">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-fill me-2"></i>Editar Periodo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/periodos/actualizar}" method="post">
                <input type="hidden" name="id" id="editId">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" name="nombre" id="editNombre" class="form-control" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Fecha Inicio</label>
                            <input type="date" name="fechaInicio" id="editFechaInicio" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha Fin</label>
                            <input type="date" name="fechaFin" id="editFechaFin" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-accent">Actualizar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function cargarEditar(id) {
        fetch('/periodos/editar/' + id)
            .then(response => response.json())
            .then(p => {
                document.getElementById('editId').value = p.id || '';
                document.getElementById('editNombre').value = p.nombre || '';
                document.getElementById('editFechaInicio').value = p.fechaInicio || '';
                document.getElementById('editFechaFin').value = p.fechaFin || '';
            });
    }
</script>
</body>
</html>
