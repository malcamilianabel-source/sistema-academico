<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodos - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div id="sidebar-overlay"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="main-content" class="flex-grow-1">        <div class="top-navbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn-sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <h1 class="page-title"><i class="bi bi-calendar3 me-2"></i>Periodos Académicos</h1>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="user-name-sm" style="font-size:0.85rem;color:#3D4D55;" th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span>
                <div class="user-badge" th:text="${#strings.substring(session.usuario.nombre,0,1)}"></div>
            </div>
        </div>
        <div class="page-content">
            <div th:if="${mensaje}" class="alert alert-success d-flex align-items-center gap-2 mb-3 py-2"><i class="bi bi-check-circle-fill"></i><span th:text="${mensaje}"></span></div>
            <div class="tabla-container">
                <div class="tabla-header">
                    <h5><i class="bi bi-calendar3 me-2" style="color:#B58863;"></i>Lista de Periodos</h5>
                    <button class="btn btn-sm btn-accent" data-bs-toggle="modal" data-bs-target="#modalNuevo"><i class="bi bi-plus-lg me-1"></i> Nuevo Periodo</button>
                </div>
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead><tr><th>#</th><th>Nombre</th><th class="col-hide-sm">Fecha Inicio</th><th class="col-hide-sm">Fecha Fin</th><th>Acciones</th></tr></thead>
                        <tbody>
                        <tr th:each="p, stat : ${periodos}">
                            <td th:text="${stat.count}"></td><td th:text="${p.nombre}"></td>
                            <td class="col-hide-sm" th:text="${p.fechaInicio}"></td><td class="col-hide-sm" th:text="${p.fechaFin}"></td>
                            <td>
                                <button class="btn btn-edit btn-sm me-1" th:onclick="'cargarEditar(' + ${p.id} + ')'" data-bs-toggle="modal" data-bs-target="#modalEditar"><i class="bi bi-pencil-fill"></i></button>
                                <a th:href="@{/periodos/eliminar/{id}(id=${p.id})}" class="btn btn-delete btn-sm" onclick="return confirm('¿Eliminar este periodo?')"><i class="bi bi-trash-fill"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(periodos)}"><td colspan="5" class="text-center py-4" style="color:#A79E9C;"><i class="bi bi-inbox fs-3 d-block mb-2"></i>No se encontraron periodos.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevo" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-calendar-plus me-2"></i>Nuevo Periodo</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form th:action="@{/periodos/guardar}" method="post" id="formNuevo" novalidate><div class="modal-body">
        <div class="mb-3"><label class="form-label">Nombre * <small class="text-muted">(Ej: 2026-I)</small></label>
            <input type="text" name="nombre" class="form-control" pattern="^[\w\s\-\.]{2,50}$" maxlength="50" required>
            <div class="invalid-feedback">Ingresa un nombre de periodo válido.</div></div>
        <div class="row g-3">
            <div class="col-6"><label class="form-label">Fecha Inicio</label><input type="date" name="fechaInicio" class="form-control"></div>
            <div class="col-6"><label class="form-label">Fecha Fin</label><input type="date" name="fechaFin" class="form-control"></div>
        </div>
    </div><div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-accent btn-sm"><i class="bi bi-save me-1"></i>Guardar</button>
    </div></form>
</div></div></div>

<div class="modal fade" id="modalEditar" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-pencil-fill me-2"></i>Editar Periodo</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form th:action="@{/periodos/actualizar}" method="post" id="formEditar" novalidate><input type="hidden" name="id" id="editId"><div class="modal-body">
        <div class="mb-3"><label class="form-label">Nombre *</label>
            <input type="text" name="nombre" id="editNombre" class="form-control" pattern="^[\w\s\-\.]{2,50}$" maxlength="50" required>
            <div class="invalid-feedback">Ingresa un nombre válido.</div></div>
        <div class="row g-3">
            <div class="col-6"><label class="form-label">Fecha Inicio</label><input type="date" name="fechaInicio" id="editFechaInicio" class="form-control"></div>
            <div class="col-6"><label class="form-label">Fecha Fin</label><input type="date" name="fechaFin" id="editFechaFin" class="form-control"></div>
        </div>
    </div><div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-accent btn-sm"><i class="bi bi-save me-1"></i>Actualizar</button>
    </div></form>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    // Sidebar toggle
    const _sb=document.getElementById('sidebar'),_ov=document.getElementById('sidebar-overlay'),_btn=document.getElementById('sidebarToggle');
    if(_btn)_btn.addEventListener('click',()=>{_sb.classList.add('sidebar-open');_ov.classList.add('show');});
    if(_ov)_ov.addEventListener('click',()=>{_sb.classList.remove('sidebar-open');_ov.classList.remove('show');});
    // Validacion
    function activarVal(...ids){ids.forEach(fid=>{const f=document.getElementById(fid);if(!f)return;f.addEventListener('submit',e=>{if(!f.checkValidity()){e.preventDefault();e.stopPropagation();}f.classList.add('was-validated');});f.closest('.modal')?.addEventListener('hidden.bs.modal',()=>f.classList.remove('was-validated'));});}
    function soloNum(e){e.target.value=e.target.value.replace(/[^0-9]/g,'');}


    function cargarEditar(id){
        fetch('/periodos/editar/'+id).then(r=>r.json()).then(p=>{
            document.getElementById('editId').value=p.id||'';
            document.getElementById('editNombre').value=p.nombre||'';
            document.getElementById('editFechaInicio').value=p.fechaInicio||'';
            document.getElementById('editFechaFin').value=p.fechaFin||'';
            document.getElementById('formEditar').classList.remove('was-validated');
        });
    }
    activarVal('formNuevo','formEditar');

</script>
</body>
</html>
