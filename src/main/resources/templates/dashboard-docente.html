<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi panel — Sistema Académico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div id="sidebar-overlay"></div><div class="d-flex"><div th:replace="~{fragments/sidebar :: sidebar}"></div><div id="main-content" class="flex-grow-1"><div class="top-navbar"><div class="d-flex align-items-center gap-2"><button class="btn-sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button><h1 class="page-title">Mi panel académico</h1></div></div><div class="page-content"><h3 class="mb-3">Bienvenido, <span th:text="${session.usuario.nombre}"></span></h3><div class="row g-3 mb-4"><div class="col-md-4"><div class="card panel-card p-3"><small>Mis secciones</small><h2 th:text="${totalSecciones}"></h2></div></div><div class="col-md-4"><div class="card panel-card p-3"><small>Matrículas activas de mis secciones</small><h2 th:text="${totalMatriculas}"></h2></div></div><div class="col-md-4"><div class="card panel-card p-3"><small>Mis sesiones</small><h2 th:text="${totalSesiones}"></h2></div></div></div><div class="tabla-container p-3"><h4>Secciones que dicto</h4><div class="table-responsive"><table class="table"><thead><tr><th>Periodo</th><th>Curso</th><th>Sección</th></tr></thead><tbody><tr th:each="cp : ${misSecciones}"><td th:text="${cp.periodo.nombre}"></td><td th:text="${cp.curso.nombre}"></td><td th:text="${cp.seccion}"></td></tr><tr th:if="${#lists.isEmpty(misSecciones)}"><td colspan="3">No tienes secciones asignadas.</td></tr></tbody></table></div><a th:href="@{/sesiones}" class="btn btn-accent btn-sm">Mis sesiones</a> <a th:href="@{/evaluaciones}" class="btn btn-accent btn-sm">Calificaciones</a> <a th:href="@{/asistencias}" class="btn btn-accent btn-sm">Asistencias</a></div></div></div></div><script>const b=document.getElementById('sidebarToggle'),s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');if(b)b.onclick=()=>{s.classList.add('sidebar-open');o.classList.add('show')};if(o)o.onclick=()=>{s.classList.remove('sidebar-open');o.classList.remove('show')}</script></body></html>
