<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi panel — Sistema Académico</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div id="sidebar-overlay"></div><div class="d-flex"><div th:replace="~{fragments/sidebar :: sidebar}"></div><div id="main-content" class="flex-grow-1"><div class="top-navbar"><div class="d-flex align-items-center gap-2"><button class="btn-sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button><h1 class="page-title">Mi panel académico</h1></div></div><div class="page-content"><h3 class="mb-3">Bienvenido, <span th:text="${session.usuario.nombre}"></span></h3><div th:if="${estudiante == null}" class="alert alert-warning">Tu cuenta aún no está vinculada a un estudiante. Consulta con el administrador.</div><div th:if="${estudiante != null}"><div class="row g-3 mb-4"><div class="col-md-6"><div class="card panel-card p-3"><small>Mis cursos activos</small><h2 th:text="${totalCursos}"></h2></div></div><div class="col-md-6"><div class="card panel-card p-3"><small>Promedio ponderado con notas registradas</small><h2 th:text="${promedio == null ? 'Sin notas' : #numbers.formatDecimal(promedio,1,2)}"></h2></div></div></div><div class="tabla-container p-3"><h4>Mis matrículas</h4><div class="table-responsive"><table class="table"><thead><tr><th>Curso</th><th>Periodo</th><th>Sección</th><th>Estado</th></tr></thead><tbody><tr th:each="m : ${misMatriculas}"><td th:text="${m.cursoPeriodo.curso.nombre}"></td><td th:text="${m.cursoPeriodo.periodo.nombre}"></td><td th:text="${m.cursoPeriodo.seccion}"></td><td th:text="${m.estado}"></td></tr><tr th:if="${#lists.isEmpty(misMatriculas)}"><td colspan="4">Sin matrículas registradas.</td></tr></tbody></table></div><a th:href="@{/matriculas}" class="btn btn-accent btn-sm">Mi matrícula</a> <a th:href="@{/historial}" class="btn btn-accent btn-sm">Mi historial</a></div></div></div></div></div><script>const b=document.getElementById('sidebarToggle'),s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');if(b)b.onclick=()=>{s.classList.add('sidebar-open');o.classList.add('show')};if(o)o.onclick=()=>{s.classList.remove('sidebar-open');o.classList.remove('show')}</script></body></html>
