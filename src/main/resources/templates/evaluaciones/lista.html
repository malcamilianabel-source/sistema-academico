<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificaciones - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="main-content" class="flex-grow-1">
        <div class="top-navbar">
            <h1 class="page-title"><i class="bi bi-journal-text me-2"></i>Calificaciones</h1>
            <div class="d-flex align-items-center gap-2">
                <span style="font-size:0.85rem; color:#3D4D55;" th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span>
                <div class="user-badge" th:text="${#strings.substring(session.usuario.nombre,0,1)}"></div>
            </div>
        </div>
        <div class="page-content">
            <div th:if="${mensaje}" class="alert alert-success py-2" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
            <div class="tabla-container">
                <div class="tabla-header">
                    <h5><i class="bi bi-journal-text me-2" style="color:#B58863;"></i>Lista de Calificaciones</h5>
                    <button class="btn btn-sm btn-accent" data-bs-toggle="modal" data-bs-target="#modalNuevo"><i class="bi bi-plus-lg me-1"></i>Nueva Calificación</button>
                </div>
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead><tr><th>#</th><th>Estudiante</th><th>Curso</th><th>Evaluación</th><th>Nota</th><th>Fecha</th><th>Acciones</th></tr></thead>
                        <tbody>
                        <tr th:each="e, stat : ${evaluaciones}">
                            <td th:text="${stat.count}"></td>
                            <td th:text="${e.matricula.estudiante.nombre + ' ' + e.matricula.estudiante.apellido}"></td>
                            <td th:text="${e.matricula.cursoPeriodo.curso.nombre}"></td>
                            <td th:text="${e.tipoEvaluacion}"></td>
                            <td><span class="badge" th:classappend="${e.nota >= 11} ? ' bg-success' : ' bg-danger'" th:text="${e.nota}"></span></td>
                            <td th:text="${e.fecha}"></td>
                            <td>
                                <button class="btn btn-edit btn-sm me-1" th:onclick="'cargarEditar(' + ${e.id} + ')'" data-bs-toggle="modal" data-bs-target="#modalEditar"><i class="bi bi-pencil-fill"></i></button>
                                <a th:href="@{/evaluaciones/eliminar/{id}(id=${e.id})}" class="btn btn-delete btn-sm" onclick="return confirm('¿Eliminar esta calificación?')"><i class="bi bi-trash-fill"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(evaluaciones)}"><td colspan="7" class="text-center py-4" style="color:#A79E9C;">No hay calificaciones registradas.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevo" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Nueva calificación</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form th:action="@{/evaluaciones/guardar}" method="post"><div class="modal-body">
        <div class="mb-3"><label class="form-label">Matrícula *</label><select name="matriculaId" class="form-select" required><option value="">Seleccionar...</option><option th:each="m : ${matriculas}" th:value="${m.id}" th:text="${m.estudiante.nombre + ' ' + m.estudiante.apellido + ' - ' + m.cursoPeriodo.curso.nombre + ' - ' + m.cursoPeriodo.periodo.nombre}"></option></select></div>
        <div class="mb-3"><label class="form-label">Tipo de evaluación *</label><input type="text" name="tipoEvaluacion" class="form-control" placeholder="Ej: Parcial, PC1, Final" required></div>
        <div class="row g-3"><div class="col-md-6"><label class="form-label">Nota *</label><input type="number" name="nota" min="0" max="20" step="0.01" class="form-control" required></div><div class="col-md-6"><label class="form-label">Fecha</label><input type="date" name="fecha" class="form-control"></div></div>
    </div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-accent">Guardar</button></div></form>
</div></div></div>

<div class="modal fade" id="modalEditar" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Editar calificación</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form th:action="@{/evaluaciones/actualizar}" method="post"><input type="hidden" name="id" id="editId"><div class="modal-body">
        <div class="mb-3"><label class="form-label">Tipo de evaluación *</label><input type="text" name="tipoEvaluacion" id="editTipo" class="form-control" required></div>
        <div class="row g-3"><div class="col-md-6"><label class="form-label">Nota *</label><input type="number" name="nota" id="editNota" min="0" max="20" step="0.01" class="form-control" required></div><div class="col-md-6"><label class="form-label">Fecha</label><input type="date" name="fecha" id="editFecha" class="form-control"></div></div>
    </div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-accent">Actualizar</button></div></form>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function cargarEditar(id){fetch('/evaluaciones/editar/'+id).then(r=>r.json()).then(e=>{document.getElementById('editId').value=e.id||'';document.getElementById('editTipo').value=e.tipoEvaluacion||'';document.getElementById('editNota').value=e.nota??'';document.getElementById('editFecha').value=e.fecha||'';});}
</script>
</body></html>
