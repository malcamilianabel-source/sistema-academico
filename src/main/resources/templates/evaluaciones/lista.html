<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificaciones - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div id="sidebar-overlay"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="main-content" class="flex-grow-1">        <div class="top-navbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn-sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <h1 class="page-title"><i class="bi bi-journal-text me-2"></i>Calificaciones</h1>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="user-name-sm" style="font-size:0.85rem;color:#3D4D55;" th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span>
                <div class="user-badge" th:text="${#strings.substring(session.usuario.nombre,0,1)}"></div>
            </div>
        </div>
        <div class="page-content">
            <div th:if="${mensaje}" class="alert alert-success d-flex align-items-center gap-2 mb-3 py-2"><i class="bi bi-check-circle-fill"></i><span th:text="${mensaje}"></span></div>
            <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 mb-3 py-2"><i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span></div>
            <div class="tabla-container">
                <div class="tabla-header">
                    <h5><i class="bi bi-journal-text me-2" style="color:#B58863;"></i>Lista de Calificaciones</h5>
                    <button class="btn btn-sm btn-accent" data-bs-toggle="modal" data-bs-target="#modalNuevo"><i class="bi bi-plus-lg me-1"></i>Nueva Calificación</button>
                </div>
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead><tr><th>#</th><th>Estudiante</th><th>Curso</th><th class="col-hide-sm">Evaluación</th><th>Nota</th><th class="col-hide-sm">Fecha</th><th>Acciones</th></tr></thead>
                        <tbody>
                        <tr th:each="e, stat : ${evaluaciones}">
                            <td th:text="${stat.count}"></td>
                            <td th:text="${e.matricula.estudiante.nombre + ' ' + e.matricula.estudiante.apellido}"></td>
                            <td th:text="${e.matricula.cursoPeriodo.curso.nombre}"></td>
                            <td class="col-hide-sm" th:text="${e.tipoEvaluacion}"></td>
                            <td><span class="badge" th:classappend="${e.nota >= 11} ? ' bg-success' : ' bg-danger'" th:text="${e.nota}"></span></td>
                            <td class="col-hide-sm" th:text="${e.fecha}"></td>
                            <td>
                                <button class="btn btn-edit btn-sm me-1" th:onclick="'cargarEditar(' + ${e.id} + ')'" data-bs-toggle="modal" data-bs-target="#modalEditar"><i class="bi bi-pencil-fill"></i></button>
                                <a th:href="@{/evaluaciones/eliminar/{id}(id=${e.id})}" class="btn btn-delete btn-sm" onclick="return confirm('¿Eliminar esta calificación?')"><i class="bi bi-trash-fill"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(evaluaciones)}"><td colspan="7" class="text-center py-4" style="color:#A79E9C;"><i class="bi bi-inbox fs-3 d-block mb-2"></i>No hay calificaciones.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevo" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-journal-plus me-2"></i>Nueva Calificación</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form th:action="@{/evaluaciones/guardar}" method="post" id="formNuevo" novalidate><div class="modal-body">
        <div class="mb-3"><label class="form-label">Matrícula *</label>
            <select name="matriculaId" class="form-select" required>
                <option value="">Seleccionar...</option>
                <option th:each="m : ${matriculas}" th:value="${m.id}" th:text="${m.estudiante.nombre + ' ' + m.estudiante.apellido + ' — ' + m.cursoPeriodo.curso.nombre + ' (' + m.cursoPeriodo.periodo.nombre + ')'}"></option>
            </select>
            <div class="invalid-feedback">Selecciona una matrícula.</div>
        </div>
        <div class="mb-3"><label class="form-label">Tipo de Evaluación * <small class="text-muted">(Ej: PC1, Parcial, Final)</small></label>
            <input type="text" name="tipoEvaluacion" class="form-control" maxlength="50" required>
            <div class="invalid-feedback">Ingresa el tipo de evaluación.</div>
        </div>
        <div class="row g-3">
            <div class="col-6"><label class="form-label">Nota * <small class="text-muted">(0–20)</small></label>
                <input type="number" name="nota" min="0" max="20" step="0.01" class="form-control" required>
                <div class="invalid-feedback">Nota entre 0 y 20.</div>
            </div>
            <div class="col-6"><label class="form-label">Fecha</label>
                <input type="date" name="fecha" class="form-control">
            </div>
        </div>
    </div><div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-accent btn-sm"><i class="bi bi-save me-1"></i>Guardar</button>
    </div></form>
</div></div></div>

<div class="modal fade" id="modalEditar" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-pencil-fill me-2"></i>Editar Calificación</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form th:action="@{/evaluaciones/actualizar}" method="post" id="formEditar" novalidate><input type="hidden" name="id" id="editId">
        <div class="modal-body">
            <div class="mb-3"><label class="form-label">Tipo de Evaluación *</label>
                <input type="text" name="tipoEvaluacion" id="editTipo" class="form-control" maxlength="50" required>
                <div class="invalid-feedback">Ingresa el tipo de evaluación.</div>
            </div>
            <div class="row g-3">
                <div class="col-6"><label class="form-label">Nota * <small class="text-muted">(0–20)</small></label>
                    <input type="number" name="nota" id="editNota" min="0" max="20" step="0.01" class="form-control" required>
                    <div class="invalid-feedback">Nota entre 0 y 20.</div>
                </div>
                <div class="col-6"><label class="form-label">Fecha</label>
                    <input type="date" name="fecha" id="editFecha" class="form-control">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-accent btn-sm"><i class="bi bi-save me-1"></i>Actualizar</button>
        </div>
    </form>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    // Sidebar toggle
    const _sb=document.getElementById('sidebar'),_ov=document.getElementById('sidebar-overlay'),_btn=document.getElementById('sidebarToggle');
    if(_btn)_btn.addEventListener('click',()=>{_sb.classList.add('sidebar-open');_ov.classList.add('show');});
    if(_ov)_ov.addEventListener('click',()=>{_sb.classList.remove('sidebar-open');_ov.classList.remove('show');});
    // Validacion
    function activarVal(...ids){ids.forEach(fid=>{const f=document.getElementById(fid);if(!f)return;f.addEventListener('submit',e=>{if(!f.checkValidity()){e.preventDefault();e.stopPropagation();}f.classList.add('was-validated');});f.closest('.modal')?.addEventListener('hidden.bs.modal',()=>f.classList.remove('was-validated'));});}
    function soloNum(e){e.target.value=e.target.value.replace(/[^0-9]/g,'');}


    function cargarEditar(id){
        fetch('/evaluaciones/editar/'+id).then(r=>r.json()).then(e=>{
            document.getElementById('editId').value=e.id||'';
            document.getElementById('editTipo').value=e.tipoEvaluacion||'';
            document.getElementById('editNota').value=e.nota??'';
            document.getElementById('editFecha').value=e.fecha||'';
            document.getElementById('formEditar').classList.remove('was-validated');
        });
    }
    activarVal('formNuevo','formEditar');

</script>
</body>
</html>
