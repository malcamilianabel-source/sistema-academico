<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Componentes</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div class="d-flex"><div th:replace="~{fragments/sidebar :: sidebar}"></div><div id="main-content" class="flex-grow-1"><div class="page-content"><h2>Evaluaciones de <span th:text="${seccion.curso.nombre}"></span> · Sección <span th:text="${seccion.seccion}"></span></h2><a th:href="@{/evaluaciones}" class="btn btn-secondary btn-sm mb-3">Volver</a><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="tabla-container p-3"><table class="table"><thead><tr><th>Evaluación</th><th>Peso</th></tr></thead><tbody><tr th:each="c : ${componentes}"><td th:text="${c.nombre}"></td><td th:text="${c.peso + '%'}"></td></tr></tbody></table></div><form class="card p-3 mt-3" th:if="${!seccion.periodo.cerrado}" th:action="@{/componentes/{id}(id=${seccion.id})}" method="post"><h5>Agregar evaluación</h5><label>Nombre</label><input name="nombre" class="form-control mb-2" maxlength="50" required><label>Peso (%)</label><input name="peso" type="number" class="form-control mb-3" min="0.01" max="100" step="0.01" required><button class="btn btn-accent" type="submit">Agregar</button></form></div></div></div></body></html>
