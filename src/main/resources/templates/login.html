<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #10232A 0%, #3D4D55 60%, #10232A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
        }
        .login-header {
            background-color: #10232A;
            padding: 2.2rem 2rem 1.8rem;
            text-align: center;
            border-bottom: 3px solid #B58863;
        }
        .login-header .logo-icon {
            width: 60px;
            height: 60px;
            background-color: #B58863;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            margin: 0 auto 1rem;
        }
        .login-header h4 {
            color: #D3C3B9;
            font-weight: 700;
            margin: 0;
            font-size: 1.15rem;
        }
        .login-header p {
            color: #A79E9C;
            font-size: 0.8rem;
            margin: 0.3rem 0 0;
        }
        .login-body {
            padding: 2rem;
        }
        .btn-login {
            background-color: #B58863;
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.75rem;
            font-size: 0.95rem;
            border-radius: 8px;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-login:hover {
            background-color: #a07550;
        }
        .form-control:focus {
            border-color: #B58863;
            box-shadow: 0 0 0 0.2rem rgba(181,136,99,0.2);
        }
        .input-group-text {
            background-color: #f0ece8;
            border-color: #dee2e6;
            color: #3D4D55;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- HEADER -->
    <div class="login-header">
        <div class="logo-icon">
            <i class="bi bi-mortarboard-fill"></i>
        </div>
        <h4>Sistema Académico</h4>
        <p>Gestión y Seguimiento Estudiantil</p>
    </div>

    <!-- BODY -->
    <div class="login-body">

        <!-- ALERTA DE ERROR -->
        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 mb-3 py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color:#3D4D55; font-size:0.85rem;">
                    Correo electrónico
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control"
                           placeholder="correo@academico.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold" style="color:#3D4D55; font-size:0.85rem;">
                    Contraseña
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="password"
                           class="form-control" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button"
                            onclick="togglePassword()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema
            </button>
        </form>

        <p class="text-center mt-3 mb-0" style="font-size:0.75rem; color:#A79E9C;">
            Universidad Tecnológica del Perú &mdash; 2026
        </p>
    </div>
</div>

<script>
    function togglePassword() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            pwd.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
