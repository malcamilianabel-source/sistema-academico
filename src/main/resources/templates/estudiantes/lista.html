<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiantes - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="main-content" class="flex-grow-1">

        <!-- TOP NAVBAR -->
        <div class="top-navbar">
            <h1 class="page-title"><i class="bi bi-people-fill me-2"></i>Estudiantes</h1>
            <div class="d-flex align-items-center gap-2">
                <span style="font-size:0.85rem; color:#3D4D55;"
                      th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span>
                <div class="user-badge"
                     th:text="${#strings.substring(session.usuario.nombre,0,1)}"></div>
            </div>
        </div>

        <div class="page-content">

            <!-- ALERTA ÉXITO -->
            <div th:if="${mensaje}" class="alert alert-success d-flex align-items-center gap-2 mb-3 py-2">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${mensaje}"></span>
            </div>

            <!-- TABLA -->
            <div class="tabla-container">
                <div class="tabla-header">
                    <h5><i class="bi bi-people-fill me-2" style="color:#B58863;"></i>Lista de Estudiantes</h5>
                    <div class="d-flex gap-2 flex-wrap">
                        <!-- BUSCADOR -->
                        <form th:action="@{/estudiantes}" method="get" class="d-flex gap-2">
                            <input type="text" name="buscar" class="form-control form-control-sm"
                                   placeholder="Buscar por nombre..." style="width:200px;"
                                   th:value="${buscar}">
                            <button type="submit" class="btn btn-sm btn-accent">
                                <i class="bi bi-search"></i>
                            </button>
                            <a th:href="@{/estudiantes}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-x"></i>
                            </a>
                        </form>
                        <!-- BOTÓN NUEVO -->
                        <button class="btn btn-sm btn-accent" data-bs-toggle="modal" data-bs-target="#modalNuevo">
                            <i class="bi bi-plus-lg me-1"></i> Nuevo Estudiante
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>DNI</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>F. Inscripción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="e, stat : ${estudiantes}">
                                <td th:text="${stat.count}"></td>
                                <td th:text="${e.nombre}"></td>
                                <td th:text="${e.apellido}"></td>
                                <td th:text="${e.dni}"></td>
                                <td th:text="${e.email}"></td>
                                <td th:text="${e.telefono}"></td>
                                <td th:text="${e.fechaInscripcion}"></td>
                                <td>
                                    <button class="btn btn-edit btn-sm me-1"
                                            th:onclick="'cargarEditar(' + ${e.id} + ')'"
                                            data-bs-toggle="modal" data-bs-target="#modalEditar">
                                        <i class="bi bi-pencil-fill"></i>
                                    </button>
                                    <a th:href="@{/estudiantes/eliminar/{id}(id=${e.id})}"
                                       class="btn btn-delete btn-sm"
                                       onclick="return confirm('¿Eliminar este estudiante?')">
                                        <i class="bi bi-trash-fill"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(estudiantes)}">
                                <td colspan="8" class="text-center py-4" style="color:#A79E9C;">
                                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                    No se encontraron estudiantes.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ══ MODAL NUEVO ══════════════════════════════════════════ -->
<div class="modal fade" id="modalNuevo" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-person-plus-fill me-2"></i>Nuevo Estudiante</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/estudiantes/guardar}" method="post">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre *</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Apellido *</label>
                            <input type="text" name="apellido" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">DNI *</label>
                            <input type="text" name="dni" class="form-control" maxlength="20" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="telefono" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha de Inscripción</label>
                            <input type="date" name="fechaInscripcion" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-accent btn-sm">
                        <i class="bi bi-save me-1"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ══ MODAL EDITAR ═════════════════════════════════════════ -->
<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-fill me-2"></i>Editar Estudiante</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/estudiantes/actualizar}" method="post">
                <input type="hidden" id="editId" name="id">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre *</label>
                            <input type="text" id="editNombre" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Apellido *</label>
                            <input type="text" id="editApellido" name="apellido" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">DNI *</label>
                            <input type="text" id="editDni" name="dni" class="form-control" maxlength="20" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" id="editEmail" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Teléfono</label>
                            <input type="text" id="editTelefono" name="telefono" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha de Inscripción</label>
                            <input type="date" id="editFechaInscripcion" name="fechaInscripcion" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-accent btn-sm">
                        <i class="bi bi-save me-1"></i> Actualizar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function cargarEditar(id) {
        fetch('/estudiantes/editar/' + id)
            .then(res => res.json())
            .then(data => {
                document.getElementById('editId').value               = data.id;
                document.getElementById('editNombre').value           = data.nombre;
                document.getElementById('editApellido').value         = data.apellido;
                document.getElementById('editDni').value              = data.dni;
                document.getElementById('editEmail').value            = data.email;
                document.getElementById('editTelefono').value         = data.telefono || '';
                document.getElementById('editFechaInscripcion').value = data.fechaInscripcion || '';
            });
    }
</script>
</body>
</html>
