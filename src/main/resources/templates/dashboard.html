<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="main-content" class="flex-grow-1">
        <div class="top-navbar">
            <h1 class="page-title"><i class="bi bi-grid-1x2-fill me-2"></i>Dashboard</h1>
            <div class="d-flex align-items-center gap-2">
                <span style="font-size:0.85rem; color:#3D4D55;" th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span>
                <div class="user-badge" th:text="${#strings.substring(session.usuario.nombre, 0, 1)}"></div>
            </div>
        </div>

        <div class="page-content">
            <div class="row g-4 mb-4">
                <div class="col-sm-6 col-xl-3"><div class="stat-card"><div class="stat-icon estudiantes"><i class="bi bi-people-fill"></i></div><div class="stat-info"><h3 th:text="${totalEstudiantes}">0</h3><p>Estudiantes</p></div></div></div>
                <div class="col-sm-6 col-xl-3"><div class="stat-card"><div class="stat-icon docentes"><i class="bi bi-person-workspace"></i></div><div class="stat-info"><h3 th:text="${totalDocentes}">0</h3><p>Docentes</p></div></div></div>
                <div class="col-sm-6 col-xl-3"><div class="stat-card"><div class="stat-icon cursos"><i class="bi bi-book-fill"></i></div><div class="stat-info"><h3 th:text="${totalCursos}">0</h3><p>Cursos</p></div></div></div>
                <div class="col-sm-6 col-xl-3"><div class="stat-card"><div class="stat-icon usuarios"><i class="bi bi-person-fill-gear"></i></div><div class="stat-info"><h3 th:text="${totalUsuarios}">0</h3><p>Usuarios</p></div></div></div>
            </div>

            <div class="tabla-container p-4">
                <h5 class="fw-bold mb-1" style="color:#10232A;">Bienvenido, <span th:text="${session.usuario.nombre}"></span></h5>
                <p class="mb-3" style="color:#A79E9C; font-size:0.85rem;">Rol: <span class="badge" style="background-color:#B58863;" th:text="${session.usuario.rol}"></span></p>

                <div th:if="${session.usuario.rol == 'ADMIN'}" class="d-flex flex-wrap gap-2">
                    <a th:href="@{/estudiantes}" class="btn btn-accent">Estudiantes</a>
                    <a th:href="@{/docentes}" class="btn btn-accent">Docentes</a>
                    <a th:href="@{/cursos}" class="btn btn-accent">Cursos</a>
                    <a th:href="@{/matriculas}" class="btn btn-accent">Matrículas</a>
                    <a th:href="@{/evaluaciones}" class="btn btn-accent">Calificaciones</a>
                    <a th:href="@{/usuarios}" class="btn btn-accent">Usuarios</a>
                </div>

                <div th:if="${session.usuario.rol == 'DOCENTE'}" class="d-flex flex-wrap gap-2">
                    <a th:href="@{/cursos}" class="btn btn-accent">Cursos</a>
                    <a th:href="@{/matriculas}" class="btn btn-accent">Matrículas</a>
                    <a th:href="@{/evaluaciones}" class="btn btn-accent">Calificaciones</a>
                </div>

                <div th:if="${session.usuario.rol == 'ESTUDIANTE'}" class="alert alert-info mb-0">
                    Sesión iniciada como estudiante. Este avance implementa hasta el registro de calificaciones.
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
