<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div class="d-flex">
    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-content" class="flex-grow-1">

        <!-- TOP NAVBAR -->
        <div class="top-navbar">
            <h1 class="page-title"><i class="bi bi-grid-1x2-fill me-2"></i>Dashboard</h1>
            <div class="d-flex align-items-center gap-2">
                <span style="font-size:0.85rem; color:#3D4D55;"
                      th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span>
                <div class="user-badge"
                     th:text="${#strings.substring(session.usuario.nombre, 0, 1)}"></div>
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="page-content">

            <!-- TARJETAS DE ESTADÍSTICAS -->
            <div class="row g-4 mb-4">
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="stat-icon estudiantes">
                            <i class="bi bi-people-fill"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${totalEstudiantes}">0</h3>
                            <p>Estudiantes</p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="stat-icon docentes">
                            <i class="bi bi-person-workspace"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${totalDocentes}">0</h3>
                            <p>Docentes</p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="stat-icon cursos">
                            <i class="bi bi-book-fill"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${totalCursos}">0</h3>
                            <p>Cursos</p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="stat-card">
                        <div class="stat-icon usuarios">
                            <i class="bi bi-person-fill-gear"></i>
                        </div>
                        <div class="stat-info">
                            <h3 th:text="${totalUsuarios}">0</h3>
                            <p>Usuarios</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ACCESOS RÁPIDOS -->
            <div class="row g-4">
                <div class="col-12">
                    <div class="tabla-container p-3">
                        <h6 class="fw-semibold mb-3" style="color:#10232A;">
                            <i class="bi bi-lightning-fill me-2" style="color:#B58863;"></i>Accesos rápidos
                        </h6>
                        <div class="d-flex flex-wrap gap-2">
                            <a th:href="@{/estudiantes}" class="btn btn-accent">
                                <i class="bi bi-people-fill me-1"></i> Ver Estudiantes
                            </a>
                            <a th:href="@{/docentes}" class="btn btn-accent">
                                <i class="bi bi-person-workspace me-1"></i> Ver Docentes
                            </a>
                            <a th:href="@{/cursos}" class="btn btn-accent">
                                <i class="bi bi-book-fill me-1"></i> Ver Cursos
                            </a>
                        </div>
                    </div>
                </div>

                <!-- PANEL DE BIENVENIDA -->
                <div class="col-12">
                    <div class="tabla-container p-4">
                        <div class="d-flex align-items-center gap-3">
                            <div style="width:50px;height:50px;background:#B58863;border-radius:12px;
                                        display:flex;align-items:center;justify-content:center;">
                                <i class="bi bi-mortarboard-fill text-white fs-4"></i>
                            </div>
                            <div>
                                <h5 class="fw-bold mb-1" style="color:#10232A;">
                                    Bienvenido, <span th:text="${session.usuario.nombre}"></span>
                                </h5>
                                <p class="mb-0" style="color:#A79E9C; font-size:0.85rem;">
                                    Sistema Web de Gestión y Seguimiento Académico &mdash;
                                    Rol:
                                    <span class="badge" style="background-color:#B58863;"
                                          th:text="${session.usuario.rol}"></span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div><!-- /page-content -->
    </div><!-- /main-content -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
