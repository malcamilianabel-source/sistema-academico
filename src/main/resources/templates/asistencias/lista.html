<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div id="sidebar-overlay"></div>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="main-content" class="flex-grow-1">
        <div class="top-navbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn-sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button>
                <h1 class="page-title"><i class="bi bi-clipboard-check me-2"></i>Asistencia</h1>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="user-name-sm" style="font-size:0.85rem;color:#3D4D55;" th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span>
                <div class="user-badge" th:text="${#strings.substring(session.usuario.nombre,0,1)}"></div>
            </div>
        </div>
        <div class="page-content">
            <div th:if="${mensaje}" class="alert alert-success d-flex align-items-center gap-2 mb-3 py-2"><i class="bi bi-check-circle-fill"></i><span th:text="${mensaje}"></span></div>
            <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 mb-3 py-2"><i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span></div>
            <div class="tabla-container">
                <div class="tabla-header">
                    <h5><i class="bi bi-clipboard-check me-2" style="color:#B58863;"></i>Selecciona una sesión</h5>
                </div>
                <div class="row g-2 p-3"><div class="col-md-4"><label for="asistenciaPeriodo" class="form-label">Periodo</label><select id="asistenciaPeriodo" class="form-select"><option value="">Todos</option></select></div><div class="col-md-4"><label for="asistenciaCurso" class="form-label">Curso</label><select id="asistenciaCurso" class="form-select"><option value="">Todos</option></select></div><div class="col-md-4"><label for="asistenciaSeccion" class="form-label">Sección</label><select id="asistenciaSeccion" class="form-select"><option value="">Todas</option></select></div></div>
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead><tr><th>Fecha</th><th>Curso</th><th class="col-hide-sm">Docente</th><th class="col-hide-sm">Aula</th><th>Estado</th><th></th></tr></thead>
                        <tbody>
                        <tr class="fila-asistencia" th:each="s : ${sesiones}" th:attr="data-periodo=${s.cursoPeriodo.periodo.nombre},data-curso=${s.cursoPeriodo.curso.nombre},data-seccion=${s.cursoPeriodo.seccion}" th:with="total=${asistenciasPorSesion.getOrDefault(s.id, 0L)}">
                            <td th:text="${#temporals.format(s.fechaSesion, 'dd/MM/yyyy')}"></td>
                            <td th:text="${s.cursoPeriodo.curso.nombre + ' · Secc. ' + s.cursoPeriodo.seccion + ' (' + s.cursoPeriodo.periodo.nombre + ')'}"></td>
                            <td class="col-hide-sm" th:text="${s.cursoPeriodo.docente.nombre + ' ' + s.cursoPeriodo.docente.apellido}"></td>
                            <td class="col-hide-sm" th:text="${s.aula + ' · ' + s.tipo}"></td>
                            <td>
                                <span th:if="${total > 0}" class="badge bg-success" th:text="${total + ' registrados'}"></span>
                                <span th:unless="${total > 0}" class="badge bg-secondary">Pendiente</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/asistencias/sesion/{id}(id=${s.id})}" class="btn btn-sm btn-accent">
                                    <i class="bi bi-pencil-square me-1"></i><span th:text="${total > 0 ? 'Editar' : 'Tomar'}">Tomar</span>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(sesiones)}"><td colspan="6" class="text-center py-4" style="color:#A79E9C;"><i class="bi bi-inbox fs-3 d-block mb-2"></i>No hay sesiones. Crea primero una sesión de clase.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">    (function(){const filas=[...document.querySelectorAll('.fila-asistencia')];const periodo=document.getElementById('asistenciaPeriodo'),curso=document.getElementById('asistenciaCurso'),seccion=document.getElementById('asistenciaSeccion');
    function poblar(select,values){let antes=select.value;select.replaceChildren(new Option('Todos',''));[...new Set(values)].sort().forEach(v=>select.add(new Option(v,v)));select.value=[...select.options].some(o=>o.value===antes)?antes:'';}
    function filtrar(){let visibles=filas.filter(f=>(!periodo.value||f.dataset.periodo===periodo.value));poblar(curso,visibles.map(f=>f.dataset.curso));visibles=visibles.filter(f=>!curso.value||f.dataset.curso===curso.value);poblar(seccion,visibles.map(f=>f.dataset.seccion));filas.forEach(f=>f.hidden=!( (!periodo.value||f.dataset.periodo===periodo.value)&&(!curso.value||f.dataset.curso===curso.value)&&(!seccion.value||f.dataset.seccion===seccion.value)));}
    poblar(periodo,filas.map(f=>f.dataset.periodo));periodo.onchange=()=>{curso.value='';seccion.value='';filtrar()};curso.onchange=()=>{seccion.value='';filtrar()};seccion.onchange=filtrar;filtrar()})();
</script>
<script>
    const _sb=document.getElementById('sidebar'),_ov=document.getElementById('sidebar-overlay'),_btn=document.getElementById('sidebarToggle');
    if(_btn)_btn.addEventListener('click',()=>{_sb.classList.add('sidebar-open');_ov.classList.add('show');});
    if(_ov)_ov.addEventListener('click',()=>{_sb.classList.remove('sidebar-open');_ov.classList.remove('show');});
</script>
</body>
</html>
