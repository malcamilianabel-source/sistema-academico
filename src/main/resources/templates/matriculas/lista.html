<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Matrículas - Sistema Académico</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head>
<body><div id="sidebar-overlay"></div><div class="d-flex"><div th:replace="~{fragments/sidebar :: sidebar}"></div><div id="main-content" class="flex-grow-1">
<div class="top-navbar"><div class="d-flex align-items-center gap-2"><button class="btn-sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button><h1 class="page-title">Matrículas</h1></div></div>
<div class="page-content"><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="tabla-container p-3"><p>Consulta las matrículas y da de baja las que estén activas.</p><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Estudiante</th><th>Curso</th><th>Periodo</th><th>Docente</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
<tr th:each="m : ${matriculas}"><td th:text="${m.estudiante.nombre + ' ' + m.estudiante.apellido}"></td><td th:text="${m.cursoPeriodo.curso.nombre}"></td><td th:text="${m.cursoPeriodo.periodo.nombre}"></td><td th:text="${m.cursoPeriodo.docente.nombre + ' ' + m.cursoPeriodo.docente.apellido}"></td><td th:text="${m.estado}"></td><td><form th:if="${m.estado == 'ACTIVO'}" th:action="@{/matriculas/baja/{id}(id=${m.id})}" method="post" onsubmit="return confirm('¿Dar de baja esta matrícula?');"><button class="btn btn-sm btn-outline-danger" type="submit">Dar de baja</button></form></td></tr>
<tr th:if="${#lists.isEmpty(matriculas)}"><td colspan="6">No hay matrículas registradas.</td></tr></tbody></table></div></div></div></div></div>
<script>const sb=document.getElementById('sidebar'),ov=document.getElementById('sidebar-overlay'),btn=document.getElementById('sidebarToggle');if(btn)btn.addEventListener('click',()=>{sb.classList.add('sidebar-open');ov.classList.add('show');});if(ov)ov.addEventListener('click',()=>{sb.classList.remove('sidebar-open');ov.classList.remove('show');});</script></body></html>
