<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrículas - Sistema Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div id="main-content" class="flex-grow-1">
        <div class="top-navbar">
            <h1 class="page-title"><i class="bi bi-journal-check me-2"></i>Matrículas</h1>
            <div class="d-flex align-items-center gap-2">
                <span style="font-size:0.85rem; color:#3D4D55;"
                      th:text="${session.usuario.nombre + ' ' + session.usuario.apellido}"></span>
                <div class="user-badge" th:text="${#strings.substring(session.usuario.nombre,0,1)}"></div>
            </div>
        </div>

        <div class="page-content">
            <div th:if="${mensaje}" class="alert alert-success d-flex align-items-center gap-2 mb-3 py-2">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${mensaje}"></span>
            </div>

            <div class="tabla-container">
                <div class="tabla-header">
                    <h5><i class="bi bi-journal-check me-2" style="color:#B58863;"></i>Lista de Matrículas</h5>
                    <button class="btn btn-sm btn-accent" data-bs-toggle="modal" data-bs-target="#modalNuevo">
                        <i class="bi bi-plus-lg me-1"></i> Nueva Matrícula
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Estudiante</th>
                            <th>Curso</th>
                            <th>Docente</th>
                            <th>Periodo</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="m, stat : ${matriculas}">
                            <td th:text="${stat.count}"></td>
                            <td th:text="${m.estudiante.nombre + ' ' + m.estudiante.apellido}"></td>
                            <td th:text="${m.cursoPeriodo.curso.nombre}"></td>
                            <td th:text="${m.cursoPeriodo.docente.nombre + ' ' + m.cursoPeriodo.docente.apellido}"></td>
                            <td th:text="${m.cursoPeriodo.periodo.nombre}"></td>
                            <td th:text="${m.fechaMatricula}"></td>
                            <td><span class="badge bg-secondary" th:text="${m.estado}"></span></td>
                            <td>
                                <button class="btn btn-edit btn-sm me-1"
                                        th:onclick="'cargarEditar(' + ${m.id} + ')'"
                                        data-bs-toggle="modal" data-bs-target="#modalEditar">
                                    <i class="bi bi-pencil-fill"></i>
                                </button>
                                <a th:href="@{/matriculas/eliminar/{id}(id=${m.id})}"
                                   class="btn btn-delete btn-sm"
                                   onclick="return confirm('¿Eliminar esta matrícula?')">
                                    <i class="bi bi-trash-fill"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(matriculas)}">
                            <td colspan="8" class="text-center py-4" style="color:#A79E9C;">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                No se encontraron matrículas.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNuevo" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-journal-plus me-2"></i>Nueva Matrícula</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/matriculas/guardar}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Estudiante *</label>
                        <select name="estudianteId" class="form-select" required>
                            <option value="">Seleccionar...</option>
                            <option th:each="e : ${estudiantes}" th:value="${e.id}" th:text="${e.nombre + ' ' + e.apellido + ' - ' + e.dni}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Curso / Periodo *</label>
                        <select name="cursoPeriodoId" class="form-select" required>
                            <option value="">Seleccionar...</option>
                            <option th:each="cp : ${cursosPeriodo}" th:value="${cp.id}"
                                    th:text="${cp.curso.codigo + ' - ' + cp.curso.nombre + ' | ' + cp.periodo.nombre + ' | ' + cp.docente.nombre + ' ' + cp.docente.apellido}"></option>
                        </select>
                        <small class="text-muted">Si no aparece ningún curso, primero crea una asignación en el menú Asignaciones.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select name="estado" class="form-select">
                            <option value="ACTIVO">ACTIVO</option>
                            <option value="RETIRADO">RETIRADO</option>
                            <option value="CULMINADO">CULMINADO</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-accent">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-pencil-fill me-2"></i>Editar Matrícula</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/matriculas/actualizar}" method="post">
                <input type="hidden" name="id" id="editMatriculaId">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select name="estado" id="editEstado" class="form-select" required>
                            <option value="ACTIVO">ACTIVO</option>
                            <option value="RETIRADO">RETIRADO</option>
                            <option value="CULMINADO">CULMINADO</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-accent">Actualizar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function cargarEditar(id) {
        fetch('/matriculas/editar/' + id)
            .then(response => response.json())
            .then(m => {
                document.getElementById('editMatriculaId').value = m.id;
                document.getElementById('editEstado').value = m.estado;
            });
    }
</script>
</body>
</html>
