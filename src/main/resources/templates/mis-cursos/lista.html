<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis cursos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div id="sidebar-overlay"></div><div class="d-flex"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main id="main-content" class="flex-grow-1"><div class="top-navbar"><button class="btn-sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button><h1 class="page-title">Mis cursos</h1></div><div class="page-content"><h4 class="mb-1">Mi aula virtual</h4><p class="text-muted mb-4">Consulta el contenido, las calificaciones y las asistencias de tus cursos.</p><div class="row g-3"><div class="col-md-6 col-xl-4" th:each="m : ${cursos}"><div class="card h-100 shadow-sm border-0"><div class="card-body"><span class="badge bg-light text-dark mb-2" th:text="${m.cursoPeriodo.periodo.nombre}">2026-II</span><h5 class="card-title" th:text="${m.cursoPeriodo.curso.nombre}">Curso</h5><div class="text-muted small mb-3" th:text="${m.cursoPeriodo.curso.codigo + ' · Sección ' + m.cursoPeriodo.seccion}"></div><p class="small mb-3"><i class="bi bi-person-workspace me-1"></i><span th:text="${m.cursoPeriodo.docente != null ? m.cursoPeriodo.docente.nombre + ' ' + m.cursoPeriodo.docente.apellido : 'Docente por asignar'}"></span></p><a class="btn btn-accent w-100" th:href="@{/mis-cursos/{id}(id=${m.id})}"><i class="bi bi-book me-1"></i> Entrar al curso</a></div></div></div></div><div class="alert alert-info" th:if="${#lists.isEmpty(cursos)}">Todavía no tienes cursos matriculados. Puedes inscribirte desde <a th:href="@{/matriculas}">Mi matrícula</a>.</div></div></main></div><script>const b=document.getElementById('sidebarToggle'),s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');b?.addEventListener('click',()=>{s?.classList.add('sidebar-open');o?.classList.add('show')});o?.addEventListener('click',()=>{s?.classList.remove('sidebar-open');o?.classList.remove('show')});</script></body></html>
