<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contenido semanal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link th:href="@{/css/estilos.css}" rel="stylesheet"></head><body><div id="sidebar-overlay"></div><div class="d-flex"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main id="main-content" class="flex-grow-1"><div class="top-navbar"><button class="btn-sidebar-toggle" id="sidebarToggle" type="button"><i class="bi bi-list"></i></button><h1 class="page-title">Contenido semanal</h1></div><div class="page-content"><a th:href="@{/asignaciones}" class="btn btn-sm btn-outline-secondary mb-3">Volver a secciones</a><h4 th:text="${seccion.curso.nombre + ' · Sección ' + seccion.seccion}"></h4><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="tabla-container p-4 mb-4"><h5>Publicar o actualizar una semana</h5><p class="small text-muted">Si guardas una semana existente, su contenido se actualizará.</p><form th:action="@{/contenido-curso/{id}/guardar(id=${seccion.id})}" method="post"><div class="row g-3"><div class="col-md-2"><label class="form-label">Semana</label><input class="form-control" type="number" min="1" max="30" name="semana" required></div><div class="col-md-10"><label class="form-label">Título</label><input class="form-control" maxlength="150" name="titulo" required></div><div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" rows="3" maxlength="1500"></textarea></div><div class="col-12"><label class="form-label">Enlace al material (opcional)</label><input class="form-control" type="url" name="enlaceMaterial" placeholder="https://..." maxlength="500"></div></div><button class="btn btn-accent mt-3" type="submit">Guardar semana</button></form></div><div class="tabla-container p-4"><h5>Semanas publicadas</h5><div class="border-bottom py-3" th:each="s : ${semanas}"><div class="d-flex justify-content-between align-items-start gap-2"><div><strong th:text="${'Semana ' + s.semana + ' — ' + s.titulo}"></strong><p class="small text-muted mb-0" th:text="${s.descripcion}"></p></div><form th:action="@{/contenido-curso/{sid}/eliminar/{id}(sid=${seccion.id},id=${s.id})}" method="post" onsubmit="return confirm('¿Eliminar esta semana?')"><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form></div></div><p th:if="${#lists.isEmpty(semanas)}" class="text-muted">No hay semanas publicadas todavía.</p></div></div></main></div><script>const b=document.getElementById('sidebarToggle'),s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');b?.addEventListener('click',()=>{s?.classList.add('sidebar-open');o?.classList.add('show')});o?.addEventListener('click',()=>{s?.classList.remove('sidebar-open');o?.classList.remove('show')});</script></body></html>
